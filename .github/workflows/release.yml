name: Publicar pacote Python no PyPI

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Construir distribuição
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar ferramentas de build
        run: python -m pip install --upgrade pip build twine pytest

      - name: Executar testes
        run: python -m pytest

      - name: Construir distribuição
        run: python -m build

      - name: Verificar distribuição
        run: python -m twine check dist/*

      - name: Armazenar distribuição
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publicar no PyPI
    needs: build
v0.0.12

    
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dio-processamento-imagem-marina
    permissions:
      id-token: write

    steps:
      - name: Baixar distribuição
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publicar no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
