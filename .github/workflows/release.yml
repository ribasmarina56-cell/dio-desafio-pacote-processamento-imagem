name: Publicar pacote Python no PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Construir distribuição
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Instalar dependências e ferramentas
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest

      - name: Construir distribuição
        run: python -m build

      - name: Verificar distribuição
        run: python -m twine check dist/*

      - name: Armazenar distribuição
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publicar no PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dio-processamento-imagem-marina
    permissions:
      id-token: write

    steps:
      - name: Baixar distribuição
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions
          path: dist

      - name: Publicar no PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
